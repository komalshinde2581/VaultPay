spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false

vaultpay:
  jwt:
    secret: 4c7365637572655f7661756c747061795f66696e746563685f6a77745f7365637265745f6b65795f32303236
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  fraud:
    large-transfer-threshold: 10000.00
    rapid-transfer-count: 3
    rapid-transfer-window-minutes: 5
    daily-velocity-limit: 25000.00
  beneficiary:
    cooling-period-hours: 24
    initial-transfer-limit: 1000.00
