services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: vaultpay-mysql
    restart: always
    environment:
      MYSQL_DATABASE: vaultpay
      MYSQL_USER: vaultpay_user
      MYSQL_PASSWORD: vaultpay_secure_password
      MYSQL_ROOT_PASSWORD: vaultpay_root_password
    ports:
      - "3306:3306"
    volumes:
      - vaultpay_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "vaultpay_user", "-pvaultpay_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaultpay-net

  # 2. Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: vaultpay-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - vaultpay_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaultpay-net

  # 3. Apache Kafka (KRaft Mode - Lightweight & Modern)
  kafka:
    image: apache/kafka:3.7.0
    container_name: vaultpay-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - vaultpay-net

  # 4. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaultpay-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vaultpay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: vaultpay_user
      DB_PASSWORD: vaultpay_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: 4c7365637572655f7661756c747061795f66696e746563685f6a77745f7365637265745f6b65795f32303236
    networks:
      - vaultpay-net

  # 5. React Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultpay-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - vaultpay-net

volumes:
  vaultpay_mysql_data:
  vaultpay_redis_data:

networks:
  vaultpay-net:
    driver: bridge
